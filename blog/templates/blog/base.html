<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Blog{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    a { color: #2563eb; } .meta { color: #666; font-size: .9rem; }
    article, .comment { border-bottom: 1px solid #ddd; padding: 1rem 0; }
    input, textarea { width: 100%; padding: .4rem; margin: .2rem 0 .8rem; box-sizing: border-box; }
  </style>
</head>
<body>
  <header><h1><a href="{% url 'post_list' %}" style="text-decoration:none">Blog</a></h1></header>
  {% block content %}{% endblock %}
</body>
</html>
